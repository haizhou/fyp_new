<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="4.0625in" viewBox="0 0 1040 650" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Online typed procurement QA and offline supervision construction</title>
<desc id="svg-desc">The upper path shows online typed planning and deterministic execution without an oracle. The lower path shows a hidden oracle applying routing gates before candidates contribute to supervision views that may overlap.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222222"/></marker>
  <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#777777"/></marker>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #171717; }
    .panel { font-size: 20px; font-weight: 700; }
    .heading { font-size: 18px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 16px; fill: #444444; }
    .tiny { font-size: 15px; fill: #666666; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 16px; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.25; }
    .learned { fill: #edf4fb; stroke: #2f6fa3; stroke-width: 1.4; }
    .det { fill: #eef8f6; stroke: #177e75; stroke-width: 1.4; }
    .gate { fill: #fff8df; stroke: #9a6410; stroke-width: 1.25; }
    .offline { fill: #fff9e8; stroke: #b07818; stroke-width: 1.3; }
    .negative { fill: #fff4f3; stroke: #b64a42; stroke-width: 1.2; }
    .muted { fill: #fafafa; stroke: #888888; stroke-width: 1.1; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #222222; stroke-width: 1.7; }
    .feedback { fill: none; stroke: #777777; stroke-width: 1.25; stroke-dasharray: 6 5; }
    .rule { stroke: #777777; stroke-width: 1.0; }
    .grid { stroke: #aaaaaa; stroke-width: 0.8; }
    .blue { fill: #2f6fa3; font-weight: 700; }
    .teal { fill: #177e75; font-weight: 700; }
    .green { fill: #2e7d32; font-weight: 700; }
    .amber { fill: #8a5b10; font-weight: 700; }
    .red { fill: #a63d36; font-weight: 700; }
  </style>
</defs>
<rect width="1040" height="650" fill="#ffffff"/>
<text x="18" y="28" class="panel" text-anchor="start">(a) Online inference without an oracle</text><rect x="18" y="54" width="82" height="76" rx="0" class="box"/><text x="27" y="79" class="heading" text-anchor="start">Input</text><text x="27" y="102" class="tiny" text-anchor="start"><tspan x="27" dy="0">question</tspan><tspan x="27" dy="19">schema</tspan></text><rect x="122" y="48" width="120" height="88" rx="0" class="learned"/><text x="131" y="73" class="heading" text-anchor="start">Step 1</text><text x="131" y="96" class="tiny" text-anchor="start"><tspan x="131" dy="0">typed intent</tspan><tspan x="131" dy="19">answer type</tspan></text><rect x="476" y="54" width="105" height="76" rx="0" class="box"/><text x="485" y="79" class="heading" text-anchor="start">DAG</text><text x="485" y="102" class="tiny" text-anchor="start"><tspan x="485" dy="0">variables</tspan><tspan x="485" dy="19">dependencies</tspan></text><rect x="613" y="54" width="112" height="76" rx="0" class="det"/><text x="622" y="79" class="heading" text-anchor="start">Ground</text><text x="622" y="102" class="tiny" text-anchor="start"><tspan x="622" dy="0">roles, guards</tspan><tspan x="622" dy="19">preflight</tspan></text><rect x="757" y="54" width="112" height="76" rx="0" class="det"/><text x="766" y="79" class="heading" text-anchor="start">Execute</text><text x="766" y="102" class="tiny" text-anchor="start"><tspan x="766" dy="0">complete sets</tspan><tspan x="766" dy="19">exact reduce</tspan></text><rect x="901" y="48" width="120" height="88" rx="0" class="box"/><text x="910" y="73" class="heading" text-anchor="start">Release</text><text x="910" y="96" class="tiny" text-anchor="start"><tspan x="910" dy="0">evidence</tspan><tspan x="910" dy="19">final checks</tspan></text><path d="M100,92 L122,92" class="arrow" marker-end="url(#arrow)"/><path d="M242,92 L250,92" class="arrow" marker-end="url(#arrow)"/><polygon points="280,62 310,92 280,122 250,92" class="gate"/><text x="280" y="86" class="tiny" text-anchor="middle"><tspan x="280" dy="0">valid?</tspan><tspan x="280" dy="18">no veto?</tspan></text><path d="M310,76 L338,76" class="arrow" marker-end="url(#arrow)"/><rect x="340" y="48" width="104" height="56" rx="0" class="det"/><text x="392" y="70" class="tiny" text-anchor="middle"><tspan x="392" dy="0">intent</tspan><tspan x="392" dy="18">compiler</tspan></text><path d="M444,76 L476,76" class="arrow" marker-end="url(#arrow)"/><path d="M280,122 L280,181 L338,181" class="feedback" marker-end="url(#gray-arrow)"/><rect x="340" y="150" width="104" height="62" rx="0" class="learned"/><text x="392" y="175" class="tiny" text-anchor="middle"><tspan x="392" dy="0">Step 2</tspan><tspan x="392" dy="18">graph plan</tspan></text><path d="M444,181 L460,181 L460,116 L476,116" class="arrow" marker-end="url(#arrow)"/><text x="319" y="68" class="tiny" text-anchor="start">yes</text><text x="288" y="143" class="tiny" text-anchor="start">no or veto</text><path d="M581,92 L613,92" class="arrow" marker-end="url(#arrow)"/><path d="M725,92 L757,92" class="arrow" marker-end="url(#arrow)"/><path d="M869,92 L901,92" class="arrow" marker-end="url(#arrow)"/><path d="M961,136 L961,153" class="arrow" marker-end="url(#arrow)"/><text x="1018" y="174" class="green" text-anchor="end">Answer with provenance</text><text x="1018" y="195" class="amber" text-anchor="end">or no answer</text><path d="M961,205 L961,238 L392,238 L392,212" class="feedback" marker-end="url(#gray-arrow)"/><text x="690" y="232" class="tiny" text-anchor="middle">One structured failure may prompt one revised plan</text><line x1="18" y1="266" x2="1022" y2="266" class="rule"/><text x="18" y="298" class="panel" text-anchor="start">(b) Offline curation with a hidden oracle</text><rect x="18" y="326" width="138" height="168" rx="0" class="box"/><text x="87" y="351" class="heading" text-anchor="middle"><tspan x="87" dy="0">Candidate</tspan><tspan x="87" dy="20">trace</tspan></text><text x="31" y="399" class="tiny" text-anchor="start"><tspan x="31" dy="0">typed plan</tspan><tspan x="31" dy="24">grounded data</tspan><tspan x="31" dy="24">runtime status</tspan><tspan x="31" dy="24">failure feedback</tspan></text><path d="M156,410 L178,410" class="arrow" marker-end="url(#arrow)"/><rect x="180" y="326" width="228" height="168" rx="0" class="offline"/><text x="294" y="354" class="heading" text-anchor="middle">Routing gates</text><text x="196" y="377" class="tiny" text-anchor="start"><tspan x="196" dy="0">runtime status recorded</tspan><tspan x="196" dy="19">runtime checks applied</tspan><tspan x="196" dy="19">expected status check</tspan><tspan x="196" dy="19">oracle on answerable items</tspan><tspan x="196" dy="19">shape on answerable items</tspan><tspan x="196" dy="19">exportable graph JSON</tspan></text><path d="M408,410 L438,410" class="arrow" marker-end="url(#arrow)"/><rect x="442" y="316" width="580" height="200" rx="0" class="muted"/><text x="732" y="340" class="heading" text-anchor="middle">Overlapping supervision views after the gates</text><text x="732" y="360" class="tiny" text-anchor="middle">Views can overlap.</text><rect x="458" y="369" width="170" height="59" rx="0" class="learned"/><text x="543" y="392" class="heading" text-anchor="middle">Direct plan</text><text x="543" y="414" class="tiny" text-anchor="middle">5,598 before caps</text><rect x="646" y="369" width="170" height="59" rx="0" class="learned"/><text x="731" y="392" class="heading" text-anchor="middle">Repair target</text><text x="731" y="414" class="tiny" text-anchor="middle">1,725 repair targets</text><rect x="834" y="369" width="172" height="59" rx="0" class="learned"/><text x="920" y="392" class="heading" text-anchor="middle">Preference pair</text><text x="920" y="414" class="tiny" text-anchor="middle">390 pairs within repair</text><rect x="458" y="442" width="170" height="65" rx="0" class="negative"/><text x="543" y="463" class="heading" text-anchor="middle">Hard negative</text><text x="543" y="483" class="tiny" text-anchor="middle"><tspan x="543" dy="0">1,262 candidates</tspan><tspan x="543" dy="17">oracle or shape differs</tspan></text><rect x="646" y="442" width="170" height="65" rx="0" class="box"/><text x="731" y="465" class="heading" text-anchor="middle">Abstention</text><text x="731" y="483" class="tiny" text-anchor="middle"><tspan x="731" dy="0">590 target pool</tspan><tspan x="731" dy="17">declared no answer</tspan></text><rect x="834" y="442" width="172" height="65" rx="0" class="offline"/><text x="920" y="465" class="heading" text-anchor="middle">Export rule</text><text x="920" y="487" class="tiny" text-anchor="middle">oracle value omitted</text><text x="18" y="536" class="small" text-anchor="start">Teacher harvest</text><text x="190" y="535" class="blue" text-anchor="middle">9,267</text><text x="190" y="557" class="tiny" text-anchor="middle">questions</text><path d="M258,546 L304,546" class="arrow" marker-end="url(#arrow)"/><text x="398" y="535" class="teal" text-anchor="middle">6,860</text><text x="398" y="557" class="tiny" text-anchor="middle">answer and runtime pass</text><text x="535" y="550" class="heading" text-anchor="middle">=</text><text x="650" y="535" class="green" text-anchor="middle">5,598</text><text x="650" y="557" class="tiny" text-anchor="middle">positive pool</text><text x="765" y="550" class="heading" text-anchor="middle">+</text><text x="900" y="535" class="red" text-anchor="middle">1,262</text><text x="900" y="557" class="tiny" text-anchor="middle">hard negatives</text><text x="520" y="585" class="tiny" text-anchor="middle">5,605 match the oracle. Seven fail the expected shape check and join the hard negatives.</text><text x="18" y="628" class="small" text-anchor="start">The hidden oracle filters candidates but contributes no content to student targets.</text></svg>