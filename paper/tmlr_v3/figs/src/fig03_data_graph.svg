<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="4.25in" viewBox="0 0 1040 680" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Procurement snapshot, organisation resolution and property graph</title>
<desc id="svg-desc">Three panels show latest release selection, ordered organisation resolution rules, and the procurement property graph with current node and edge counts.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222222"/></marker>
  <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#777777"/></marker>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #171717; }
    .panel { font-size: 20px; font-weight: 700; }
    .heading { font-size: 18px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 16px; fill: #444444; }
    .tiny { font-size: 15px; fill: #666666; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 16px; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.25; }
    .learned { fill: #edf4fb; stroke: #2f6fa3; stroke-width: 1.4; }
    .det { fill: #eef8f6; stroke: #177e75; stroke-width: 1.4; }
    .gate { fill: #fff8df; stroke: #9a6410; stroke-width: 1.25; }
    .offline { fill: #fff9e8; stroke: #b07818; stroke-width: 1.3; }
    .negative { fill: #fff4f3; stroke: #b64a42; stroke-width: 1.2; }
    .muted { fill: #fafafa; stroke: #888888; stroke-width: 1.1; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #222222; stroke-width: 1.7; }
    .feedback { fill: none; stroke: #777777; stroke-width: 1.25; stroke-dasharray: 6 5; }
    .rule { stroke: #777777; stroke-width: 1.0; }
    .grid { stroke: #aaaaaa; stroke-width: 0.8; }
    .blue { fill: #2f6fa3; font-weight: 700; }
    .teal { fill: #177e75; font-weight: 700; }
    .green { fill: #2e7d32; font-weight: 700; }
    .amber { fill: #8a5b10; font-weight: 700; }
    .red { fill: #a63d36; font-weight: 700; }
  </style>
</defs>
<rect width="1040" height="680" fill="#ffffff"/>
<text x="18" y="29" class="panel" text-anchor="start">(a) Snapshot selection</text><text x="356" y="29" class="panel" text-anchor="start">(b) Organisation resolution</text><text x="710" y="29" class="panel" text-anchor="start">(c) Property graph</text><line x1="338" y1="15" x2="338" y2="660" class="rule"/><line x1="690" y1="15" x2="690" y2="660" class="rule"/><rect x="18" y="55" width="304" height="138" rx="0" class="box"/><text x="34" y="82" class="heading" text-anchor="start">Yearly OCDS releases</text><text x="34" y="107" class="small" text-anchor="start">grouped by the same OCID</text><text x="42" y="137" class="mono" text-anchor="start">release r₁</text><text x="190" y="137" class="mono" text-anchor="start">date d₁</text><text x="42" y="163" class="mono" text-anchor="start">release r₂</text><text x="190" y="163" class="mono" text-anchor="start">date d₂</text><text x="42" y="189" class="mono" text-anchor="start">release r₃</text><text x="306" y="189" class="green" text-anchor="end">maximum date</text><path d="M170,193 L170,220" class="arrow" marker-end="url(#arrow)"/><rect x="42" y="224" width="256" height="78" rx="0" class="det"/><text x="170" y="252" class="heading" text-anchor="middle">Latest release per OCID</text><text x="170" y="280" class="small" text-anchor="middle">exact OCID and release ID</text><path d="M170,302 L170,329" class="arrow" marker-end="url(#arrow)"/><rect x="18" y="333" width="304" height="120" rx="0" class="box"/><text x="34" y="361" class="heading" text-anchor="start">Retained records</text><text x="34" y="390" class="small" text-anchor="start"><tspan x="34" dy="0">tender, lots, awards and bids</tspan><tspan x="34" dy="23">text evidence</tspan><tspan x="34" dy="23">document metadata</tspan></text><path d="M170,453 L170,483" class="arrow" marker-end="url(#arrow)"/><text x="170" y="509" class="tiny" text-anchor="middle"><tspan x="170" dy="0">Older releases remain</tspan><tspan x="170" dy="20">outside the snapshot</tspan></text><rect x="356" y="55" width="320" height="58" rx="0" class="box"/><text x="516" y="90" class="heading" text-anchor="middle">Organisation observations</text><path d="M516,113 L516,136" class="arrow" marker-end="url(#arrow)"/><rect x="356" y="140" width="320" height="330" rx="0" class="box"/><text x="516" y="168" class="heading" text-anchor="middle">Ordered resolution rules</text><text x="372" y="193" class="tiny" text-anchor="start">Rule</text><text x="660" y="193" class="tiny" text-anchor="end">Disposition</text><line x1="372" y1="202" x2="660" y2="202" class="grid"/><text x="372" y="226" class="tiny" text-anchor="start">1  Official scheme and ID</text><text x="660" y="226" class="green" text-anchor="end">canonical</text><text x="372" y="253" class="tiny" text-anchor="start"><tspan x="372" dy="0">2  FTS with the same OCID</tspan><tspan x="372" dy="18">   name and role</tspan></text><text x="660" y="262" class="amber" text-anchor="end">unique only</text><text x="372" y="298" class="tiny" text-anchor="start">3  Government lookup</text><text x="372" y="328" class="tiny" text-anchor="start">4  Exact name and region</text><text x="372" y="355" class="tiny" text-anchor="start"><tspan x="372" dy="0">5  Name only</tspan><tspan x="372" dy="18">   when region is absent</tspan></text><line x1="372" y1="389" x2="660" y2="389" class="grid"/><text x="372" y="411" class="tiny" text-anchor="start"><tspan x="372" dy="0">Jaro Winkler</tspan><tspan x="372" dy="18">similarity at least 0.92</tspan></text><text x="660" y="420" class="amber" text-anchor="end">review only</text><text x="372" y="454" class="tiny" text-anchor="start">Empty or unresolved name</text><text x="660" y="454" class="red" text-anchor="end">singleton</text><path d="M516,470 L516,494" class="arrow" marker-end="url(#arrow)"/><rect x="405" y="498" width="222" height="68" rx="0" class="det"/><text x="516" y="524" class="heading" text-anchor="middle">Alias map</text><text x="516" y="549" class="small" text-anchor="middle">with cluster audit</text><rect x="714" y="58" width="102" height="56" rx="0" class="learned"/><text x="765" y="80" class="heading" text-anchor="middle">Buyer</text><text x="765" y="101" class="tiny" text-anchor="middle">organisation</text><rect x="918" y="58" width="102" height="56" rx="0" class="learned"/><text x="969" y="80" class="heading" text-anchor="middle">Supplier</text><text x="969" y="101" class="tiny" text-anchor="middle">organisation</text><rect x="819" y="164" width="96" height="66" rx="0" class="det"/><text x="867" y="190" class="heading" text-anchor="middle"><tspan x="867" dy="0">contract</tspan><tspan x="867" dy="22">award</tspan></text><path d="M765,114 L838,164" class="arrow" marker-end="url(#arrow)"/><path d="M969,114 L896,164" class="arrow" marker-end="url(#arrow)"/><text x="794" y="137" class="tiny" text-anchor="middle">buyer_of</text><text x="940" y="137" class="tiny" text-anchor="middle">supplier_of</text><polygon points="766,258 798,288 766,318 734,288" fill="#fff8df" stroke="#9a6410" stroke-width="1.3"/><text x="766" y="294" class="small" text-anchor="middle">CPV</text><rect x="924" y="259" width="96" height="58" rx="0" class="box"/><text x="972" y="282" class="tiny" text-anchor="middle"><tspan x="972" dy="0">evidence</tspan><tspan x="972" dy="18">node</tspan></text><path d="M840,230 L785,267" class="arrow" marker-end="url(#arrow)"/><path d="M894,230 L950,259" class="arrow" marker-end="url(#arrow)"/><text x="812" y="250" class="tiny" text-anchor="end">categorized_by</text><text x="922" y="250" class="tiny" text-anchor="start">evidence_for</text><text x="714" y="349" class="heading" text-anchor="start">Node counts</text><text x="714" y="376" class="tiny" text-anchor="start">contracts</text><text x="1020" y="376" class="tiny" text-anchor="end">215,221</text><text x="714" y="400" class="tiny" text-anchor="start">organisations</text><text x="1020" y="400" class="tiny" text-anchor="end">131,502</text><text x="714" y="424" class="tiny" text-anchor="start">CPV</text><text x="1020" y="424" class="tiny" text-anchor="end">3,870</text><text x="714" y="448" class="tiny" text-anchor="start">evidence</text><text x="1020" y="448" class="tiny" text-anchor="end">535,731</text><line x1="714" y1="464" x2="1020" y2="464" class="grid"/><text x="714" y="491" class="heading" text-anchor="start">Edge counts</text><text x="714" y="518" class="tiny" text-anchor="start">buyer_of</text><text x="1020" y="518" class="tiny" text-anchor="end">215,218</text><text x="714" y="542" class="tiny" text-anchor="start">supplier_of</text><text x="1020" y="542" class="tiny" text-anchor="end">334,063</text><text x="714" y="566" class="tiny" text-anchor="start">categorized_by</text><text x="1020" y="566" class="tiny" text-anchor="end">164,691</text><text x="714" y="590" class="tiny" text-anchor="start">evidence_for</text><text x="1020" y="590" class="tiny" text-anchor="end">1,326,240</text><line x1="714" y1="606" x2="1020" y2="606" class="grid"/><text x="714" y="634" class="teal" text-anchor="start">Parquet backed graph</text><text x="714" y="657" class="small" text-anchor="start">Source metadata retained</text></svg>