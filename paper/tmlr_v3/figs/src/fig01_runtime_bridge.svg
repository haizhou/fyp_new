<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="4.0625in" viewBox="0 0 1040 650" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">A procurement bridge query reconstructed through deterministic replay</title>
<desc id="svg-desc">A saved Step 1 artifact is recompiled and replayed without a model call. The replay finds twenty one source records, derives sixteen buyer values, binds them into a target query, and counts one thousand nine hundred forty records. This reconstruction is not a saved final trace.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222222"/></marker>
  <marker id="gray-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888888"/></marker>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #181818; }
    .panel { font-size: 20px; font-weight: 700; }
    .heading { font-size: 18px; font-weight: 700; }
    .body { font-size: 16px; }
    .small { font-size: 15.5px; fill: #444444; }
    .tiny { font-size: 14.5px; fill: #666666; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 14.5px; }
    .input { fill: #f2f2f2; stroke: #777777; stroke-width: 1.2; }
    .artifact { fill: #ffffff; stroke: #333333; stroke-width: 1.25; }
    .learned { fill: #edf4fb; stroke: #2f6fa3; stroke-width: 1.4; }
    .deterministic { fill: #eef8f6; stroke: #177e75; stroke-width: 1.4; }
    .bypassed { fill: #fafafa; stroke: #888888; stroke-width: 1.1; stroke-dasharray: 6 5; }
    .check { fill: #ffffff; stroke: #2e7d32; stroke-width: 1.4; }
    .warning { fill: #fff7df; stroke: #b07818; stroke-width: 1.2; }
    .rule { stroke: #666666; stroke-width: 1.3; stroke-dasharray: 7 6; }
    .grid { stroke: #777777; stroke-width: 0.8; }
    .arrow { fill: none; stroke: #222222; stroke-width: 1.8; }
    .branch { fill: none; stroke: #888888; stroke-width: 1.25; stroke-dasharray: 6 5; }
    .blue { fill: #2f6fa3; font-weight: 700; }
    .teal { fill: #177e75; font-weight: 700; }
    .green { fill: #2e7d32; font-weight: 700; }
    .amber { fill: #9a6410; font-weight: 700; }
    .gray { fill: #777777; }
  </style>
</defs>
<rect width="1040" height="650" fill="#ffffff"/>
<rect x="18" y="16" width="1004" height="62" rx="5" class="deterministic"/><text x="34" y="43" class="heading" text-anchor="start">Figure eligibility</text><text x="205" y="40" class="small" text-anchor="start">Saved Step 1 artifact reconstructed by deterministic replay</text><text x="205" y="63" class="tiny" text-anchor="start">No model call. This is not a saved final trace.</text><text x="18" y="108" class="panel" text-anchor="start">(a) Question and executable graph</text><rect x="18" y="126" width="200" height="170" rx="0" class="input"/><text x="34" y="153" class="heading" text-anchor="start">Input question</text><text x="34" y="179" class="tiny" text-anchor="start"><tspan x="34" dy="0">Record check</tspan><tspan x="34" dy="18">How many contract</tspan><tspan x="34" dy="18">notices were published</tspan><tspan x="34" dy="18">by buyers that</tspan><tspan x="34" dy="18">awarded a contract</tspan><tspan x="34" dy="18">to Dodd Group</tspan><tspan x="34" dy="18">(Midlands) Limited?</tspan></text><path d="M218,211 L246,211" class="arrow" marker-end="url(#arrow)"/><rect x="250" y="126" width="250" height="170" rx="0" class="learned"/><text x="266" y="153" class="heading" text-anchor="start">Saved Step 1 artifact</text><text x="266" y="177" class="small" text-anchor="start">Typed intent</text><text x="266" y="203" class="mono" text-anchor="start"><tspan x="266" dy="0">A  supplier is Dodd Group</tspan><tspan x="266" dy="22">B  distinct awarding buyers</tspan><tspan x="266" dy="22">C  notices from buyers in B</tspan><tspan x="266" dy="22">D  count C</tspan></text><path d="M500,169 L544,169" class="arrow" marker-end="url(#arrow)"/><rect x="548" y="126" width="180" height="86" rx="0" class="deterministic"/><text x="638" y="151" class="heading" text-anchor="middle">Deterministic</text><text x="638" y="175" class="small" text-anchor="middle">intent compiler</text><text x="638" y="198" class="tiny" text-anchor="middle">valid and no veto</text><path d="M500,252 L522,252 L522,264 L544,264" class="branch" marker-end="url(#gray-arrow)"/><rect x="548" y="232" width="180" height="64" rx="0" class="bypassed"/><text x="638" y="257" class="heading" text-anchor="middle">Step 2 planner</text><text x="638" y="280" class="tiny" text-anchor="middle">not used here</text><path d="M728,169 L772,169" class="arrow" marker-end="url(#arrow)"/><rect x="776" y="126" width="246" height="170" rx="0" class="artifact"/><text x="899" y="153" class="heading" text-anchor="middle">Typed DAG</text><text x="899" y="178" class="mono" text-anchor="middle"><tspan x="899" dy="0">A  source records</tspan><tspan x="899" dy="17">↓</tspan><tspan x="899" dy="17">B  distinct buyers</tspan><tspan x="899" dy="17">↓</tspan><tspan x="899" dy="17">C  bound records</tspan><tspan x="899" dy="17">↓</tspan><tspan x="899" dy="17">D  count C</tspan></text><line x1="18" y1="320" x2="1022" y2="320" class="rule"/><text x="18" y="352" class="panel" text-anchor="start">(b) Deterministic bridge execution</text><rect x="18" y="375" width="220" height="240" rx="0" class="artifact"/><text x="34" y="403" class="heading" text-anchor="start">A  source records</text><text x="34" y="431" class="mono" text-anchor="start"><tspan x="34" dy="0">supplier is Dodd Group</tspan><tspan x="34" dy="20">(Midlands) Limited</tspan></text><line x1="34" y1="468" x2="222" y2="468" class="grid"/><text x="34" y="493" class="small" text-anchor="start">Dudley MBC</text><text x="34" y="517" class="small" text-anchor="start">Solihull MBC</text><text x="34" y="541" class="small" text-anchor="start">Fusion21</text><text x="222" y="597" class="teal" text-anchor="end">21 records</text><path d="M238,493 L266,493" class="arrow" marker-end="url(#arrow)"/><rect x="270" y="375" width="200" height="240" rx="0" class="artifact"/><text x="286" y="403" class="heading" text-anchor="start">B  buyer values</text><text x="286" y="431" class="tiny" text-anchor="start">emit distinct buyers</text><line x1="286" y1="450" x2="454" y2="450" class="grid"/><text x="286" y="477" class="small" text-anchor="start">Dudley MBC</text><text x="286" y="501" class="small" text-anchor="start">Solihull MBC</text><text x="286" y="525" class="small" text-anchor="start">Education</text><text x="286" y="549" class="small" text-anchor="start">and 13 more</text><text x="454" y="597" class="teal" text-anchor="end">16 values</text><path d="M470,493 L498,493" class="arrow" marker-end="url(#arrow)"/><rect x="502" y="375" width="220" height="240" rx="0" class="artifact"/><text x="518" y="403" class="heading" text-anchor="start">C  bound records</text><text x="518" y="431" class="tiny" text-anchor="start">buyer name is in B</text><line x1="518" y1="450" x2="706" y2="450" class="grid"/><text x="518" y="477" class="small" text-anchor="start">DfE</text><text x="518" y="501" class="small" text-anchor="start">Sandwell</text><text x="518" y="525" class="small" text-anchor="start">Fusion21</text><text x="518" y="549" class="small" text-anchor="start">13 other buyers</text><text x="706" y="597" class="teal" text-anchor="end">1,940 records</text><path d="M722,493 L750,493" class="arrow" marker-end="url(#arrow)"/><rect x="754" y="375" width="268" height="240" rx="0" class="check"/><text x="888" y="403" class="heading" text-anchor="middle">Released result</text><text x="888" y="435" class="teal" text-anchor="middle">COUNT(C) = 1,940</text><text x="770" y="470" class="green" text-anchor="start">graph execution passed</text><text x="770" y="494" class="green" text-anchor="start">matched records 1,940</text><text x="770" y="518" class="green" text-anchor="start">answer sanity passed</text><rect x="770" y="536" width="236" height="64" rx="0" class="warning"/><text x="888" y="554" class="amber" text-anchor="middle"><tspan x="888" dy="0">Coverage note</tspan><tspan x="888" dy="19">8 / 200 sampled rows</tspan><tspan x="888" dy="19">lack supplier data</tspan></text></svg>