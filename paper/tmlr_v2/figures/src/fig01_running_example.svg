<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="3.25in" viewBox="0 0 1000 500" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Running example for a typed compositional procurement query</title>
<desc id="svg-desc">The same procurement records feed a base program and a typed compositional program. The base program reverses buyer and supplier roles and returns contract identifiers, producing an empty set. The typed program materialises supplier values, follows them to buyer-name values, removes the anchor string, and returns seventeen stored names.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 z" fill="#1d1d1d"/></marker>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #171717; }
    .panel { font-size: 17.5px; font-weight: 700; }
    .label { font-size: 14.5px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 13px; fill: #4e4e4e; }
    .mini { font-size: 12.5px; fill: #555555; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 13.2px; }
    .mono-small { font-family: "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .rule { stroke: #222222; stroke-width: 1.1; }
    .light-rule { stroke: #777777; stroke-width: 0.8; }
    .divider { stroke: #777777; stroke-width: 1; stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #1d1d1d; stroke-width: 1.35; }
    .buyer-dot { fill: #dce9f4; stroke: #2f6fa3; stroke-width: 1; }
    .supplier-dot { fill: #f4e7a1; stroke: #8d7518; stroke-width: 1; }
    .data-edge { fill: none; stroke: #555555; stroke-width: 0.9; }
    .state { fill: #ffffff; stroke: #555555; stroke-width: 0.9; }
    .state-blue { fill: #ffffff; stroke: #2f6fa3; stroke-width: 1.1; }
    .result { fill: #ffffff; stroke: #2e7d32; stroke-width: 1; }
    .error { fill: #b3261e; font-weight: 700; }
    .correct { fill: #2e7d32; font-weight: 700; }
    .ours { fill: #2f6fa3; font-weight: 700; }
    .highlight { fill: #f4e7a1; }
    .answer-highlight { fill: #edf5fa; }
  </style>
</defs>
<rect width="1000" height="500" fill="#ffffff"/>
<text x="15" y="24" class="label" text-anchor="start">Example: a three-hop procurement query</text><text x="15" y="47" class="body"><tspan x="15" dy="0">Follow DfI Transport and Road Asset Management TRAM&#x27;s lead suppliers outward: setting DfI Transport and Road Asset Management</tspan><tspan x="15" dy="18">TRAM itself aside, which buyers do those same suppliers also work for?</tspan></text><line x1="15" y1="82" x2="985" y2="82" class="rule"/><line x1="275" y1="96" x2="275" y2="486" class="light-rule"/><text x="15" y="104" class="label" text-anchor="start">Observed buyer–supplier</text><text x="15" y="121" class="label" text-anchor="start">records (excerpt)</text><text x="15" y="139" class="mini" text-anchor="start">Frozen record universe</text><path d="M45,218 C72,218 88,166 115,166" class="data-edge"/><path d="M45,218 C72,218 88,270 115,270" class="data-edge"/><path d="M129,166 C156,166 196,143 223,143" class="data-edge"/><path d="M129,166 C156,166 196,190 223,190" class="data-edge"/><path d="M129,270 C156,270 196,270 223,270" class="data-edge"/><circle cx="38" cy="218" r="6" class="buyer-dot"/><circle cx="230" cy="143" r="6" class="buyer-dot"/><circle cx="230" cy="190" r="6" class="buyer-dot"/><circle cx="230" cy="270" r="6" class="buyer-dot"/><rect x="116" y="160" width="12" height="12" class="supplier-dot"/><rect x="116" y="264" width="12" height="12" class="supplier-dot"/><text x="15" y="240" class="mini"><tspan x="15" dy="0">DfI … TRAM</tspan><tspan x="15" dy="14">(anchor buyer)</tspan></text><text x="78" y="150" class="mini"><tspan x="78" dy="0">JOHN MCQUILLAN</tspan><tspan x="78" dy="14">CONTRACTS LTD</tspan></text><text x="88" y="291" class="mini" text-anchor="start">W.D.M. LIMITED</text><text x="166" y="127" class="mini"><tspan x="166" dy="0">Ards &amp;</tspan><tspan x="166" dy="14">North Down</tspan></text><text x="181" y="211" class="mini" text-anchor="start">NI Water</text><text x="181" y="291" class="mini" text-anchor="start">Leeds CC</text><text x="246" y="239" class="panel" text-anchor="middle">⋮</text><text x="15" y="319" class="mini" text-anchor="start">Record projection</text><rect x="15" y="330" width="245" height="144" fill="#ffffff" stroke="#333333" stroke-width="0.8"/><rect x="91" y="354" width="82" height="120" class="highlight"/><line x1="91" y1="330" x2="91" y2="474" class="light-rule"/><line x1="173" y1="330" x2="173" y2="474" class="light-rule"/><line x1="15" y1="354" x2="260" y2="354" class="light-rule"/><line x1="15" y1="378" x2="260" y2="378" class="light-rule"/><line x1="15" y1="402" x2="260" y2="402" class="light-rule"/><line x1="15" y1="426" x2="260" y2="426" class="light-rule"/><line x1="15" y1="450" x2="260" y2="450" class="light-rule"/><text x="19" y="347" class="mini" text-anchor="start">buyer</text><text x="95" y="347" class="mini" text-anchor="start">supplier</text><text x="177" y="347" class="mini" text-anchor="start">contract suffix</text><text x="19" y="371" class="mini" text-anchor="start">DfI … TRAM</text><text x="95" y="371" class="mini" text-anchor="start">JOHN MCQ.</text><text x="177" y="371" class="mini" text-anchor="start">…030700</text><text x="19" y="395" class="mini" text-anchor="start">Ards &amp; N. Down</text><text x="95" y="395" class="mini" text-anchor="start">JOHN MCQ.</text><text x="177" y="395" class="mini" text-anchor="start">…011224</text><text x="19" y="419" class="mini" text-anchor="start">NI Water</text><text x="95" y="419" class="mini" text-anchor="start">JOHN MCQ.</text><text x="177" y="419" class="mini" text-anchor="start">…004375</text><text x="19" y="443" class="mini" text-anchor="start">DfI … TRAM</text><text x="95" y="443" class="mini" text-anchor="start">W.D.M.</text><text x="177" y="443" class="mini" text-anchor="start">…013310</text><text x="19" y="467" class="mini" text-anchor="start">Leeds CC</text><text x="95" y="467" class="mini" text-anchor="start">W.D.M.</text><text x="177" y="467" class="mini" text-anchor="start">…017146</text><circle cx="20" cy="486" r="5" class="buyer-dot"/><text x="30" y="490" class="mini" text-anchor="start">buyer value</text><rect x="116" y="481" width="10" height="10" class="supplier-dot"/><text x="132" y="490" class="mini" text-anchor="start">supplier value</text><text x="291" y="108" class="panel" text-anchor="start">(a) Direct plan generation (base model)</text><text x="295" y="139" class="mono" text-anchor="start">VALUES_contract_id[supplier_name = k]  −</text><text x="600" y="139" class="mono" text-anchor="start">VALUES_contract_id[buyer_name = k]  →  [ ]</text><line x1="424" y1="145" x2="558" y2="145" stroke="#b3261e" stroke-width="1.2"/><line x1="349" y1="145" x2="422" y2="145" stroke="#b3261e" stroke-width="1.2"/><line x1="654" y1="145" x2="727" y2="145" stroke="#b3261e" stroke-width="1.2"/><text x="430" y="165" class="error" text-anchor="start">buyer/supplier role reversed</text><text x="642" y="184" class="error" text-anchor="start">wrong return field</text><text x="960" y="165" class="error" text-anchor="middle">✗</text><text x="293" y="184" class="mini" text-anchor="start">k = DfI Transport and Road Asset Management TRAM</text><line x1="291" y1="210" x2="985" y2="210" class="divider"/><text x="291" y="236" class="panel" text-anchor="start">(b) Typed compositional query</text><text x="295" y="263" class="mono" text-anchor="start">S = VALUES_supplier( FILTER_buyer=k(R) )</text><text x="295" y="284" class="mono" text-anchor="start">A = VALUES_buyer( FILTER_supplier∈S(R) ) \ {k}</text><text x="804" y="263" class="ours" text-anchor="start">validate_tree(A) → VALUES  ✓</text><rect x="295" y="305" width="112" height="65" rx="0" class="state"/><text x="303" y="325" class="label" text-anchor="start">R₀</text><text x="303" y="346" class="mono-small" text-anchor="start">buyer_name</text><text x="303" y="361" class="mono-small" text-anchor="start">= k</text><text x="351" y="389" class="mini" text-anchor="middle">35 records</text><path d="M407,335 L426,335" class="arrow" marker-end="url(#arrow)"/><rect x="430" y="305" width="112" height="65" rx="0" class="state-blue"/><text x="438" y="325" class="label" text-anchor="start">S</text><text x="438" y="346" class="mono-small" text-anchor="start">VALUES</text><text x="438" y="361" class="mono-small" text-anchor="start">supplier_name</text><text x="486" y="389" class="mini" text-anchor="middle">17 supplier values</text><path d="M542,335 L561,335" class="arrow" marker-end="url(#arrow)"/><rect x="565" y="305" width="112" height="65" rx="0" class="state"/><text x="573" y="325" class="label" text-anchor="start">R₁</text><text x="573" y="346" class="mono-small" text-anchor="start">supplier_name</text><text x="573" y="361" class="mono-small" text-anchor="start">∈ S</text><text x="621" y="389" class="mini" text-anchor="middle">119 records</text><path d="M677,335 L696,335" class="arrow" marker-end="url(#arrow)"/><rect x="700" y="305" width="112" height="65" rx="0" class="state-blue"/><text x="708" y="325" class="label" text-anchor="start">B</text><text x="708" y="346" class="mono-small" text-anchor="start">VALUES</text><text x="708" y="361" class="mono-small" text-anchor="start">buyer_name</text><text x="756" y="389" class="mini" text-anchor="middle">18 buyer-name values</text><path d="M812,335 L831,335" class="arrow" marker-end="url(#arrow)"/><rect x="835" y="305" width="112" height="65" rx="0" class="state-blue"/><text x="843" y="325" class="label" text-anchor="start">A</text><text x="843" y="346" class="mono-small" text-anchor="start">B \ {k}</text><text x="843" y="361" class="mono-small" text-anchor="start"></text><text x="891" y="389" class="mini" text-anchor="middle">17 stored values</text><text x="295" y="418" class="label" text-anchor="start">17 stored buyer-name values</text><rect x="295" y="428" width="690" height="54" class="result"/><text x="307" y="449" class="small" text-anchor="start">Ards and North Down Borough Council</text><text x="307" y="470" class="small" text-anchor="start">Leeds City Council  ·  NI Water and its subsidiaries  ·  Education Authority NI  ·  …</text><text x="970" y="449" class="correct" text-anchor="end">exact oracle-set match ✓</text></svg>