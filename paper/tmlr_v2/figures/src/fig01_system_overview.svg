<rect width="1200" height="760" fill="#ffffff"/>
<text x="30" y="31" class="title" text-anchor="start">CICADA: understand first, then plan and verify</text><text x="30" y="49" class="subtitle" text-anchor="start">Full runtime above · separate PACS capability evidence below</text><rect x="1021" y="20" width="149" height="23" rx="11.5" class="green-pill"/><text x="1095.5" y="35.5" class="pill-text" text-anchor="middle">AUDITABLE BY DESIGN</text><text x="30" y="73" class="section" text-anchor="start">A  FULL DEPLOYED KGQA RUNTIME</text><rect x="25" y="84" width="1150" height="250" rx="16" class="lane"/><rect x="45" y="108" width="175" height="104" rx="12" class="question"/><rect x="58" y="119" width="91" height="23" rx="11.5" class="gray-pill"/><text x="103.5" y="134.5" class="pill-text" text-anchor="middle">USER INPUT</text><text x="58" y="157" class="node-title" text-anchor="start">Question</text><text x="58" y="175" class="body"><tspan x="58" dy="0">+ retrieved KG</tspan><tspan x="58" dy="15">schema context</tspan></text><rect x="259" y="102" width="190" height="116" rx="13" class="blue-card"/><rect x="272" y="113" width="72" height="23" rx="11.5" class="blue-pill"/><text x="308.0" y="128.5" class="pill-text" text-anchor="middle">STEP 1</text><text x="272" y="154" class="node-title" text-anchor="start">Intent understander</text><text x="272" y="173" class="small"><tspan x="272" dy="0">answer signature</tspan><tspan x="272" dy="14">typed intent program</tspan><tspan x="272" dy="14">unsupported cues</tspan></text><path d="M 220 160 L 259 160" class="arrow" marker-end="url(#arrowhead)"/><polygon points="490,160 548,112 606,160 548,208" fill="#fff8e8" stroke="#d7a842" stroke-width="1.3"/><text x="548" y="151" class="small" text-anchor="middle">valid</text><text x="548" y="165" class="small" text-anchor="middle">intent</text><text x="548" y="179" class="small" text-anchor="middle">program?</text><path d="M 449 160 L 490 160" class="arrow" marker-end="url(#arrowhead)"/><text x="563" y="222" class="tiny" text-anchor="start">yes</text><text x="611" y="153" class="tiny" text-anchor="start">no</text><rect x="625" y="96" width="190" height="93" rx="13" class="violet-card"/><rect x="638" y="107" width="72" height="23" rx="11.5" class="gray-pill"/><text x="674.0" y="122.5" class="pill-text" text-anchor="middle">STEP 2</text><text x="638" y="145" class="node-title" text-anchor="start">Graph planner</text><text x="638" y="163" class="small"><tspan x="638" dy="0">variables · bindings · return</tspan></text><path d="M 606 160 L 625 160" class="arrow" marker-end="url(#arrowhead)"/><rect x="625" y="224" width="190" height="82" rx="13" class="cyan-card"/><text x="638" y="250" class="node-title" text-anchor="start">Deterministic compiler</text><text x="638" y="269" class="small"><tspan x="638" dy="0">resolve entities · check DAG</tspan><tspan x="638" dy="14">ground executable variables</tspan></text><path d="M 548 208 L 548 265 L 625 265" class="arrow" marker-end="url(#arrowhead)"/><path d="M 720 189 L 720 224" class="arrow" marker-end="url(#arrowhead)"/><rect x="854" y="102" width="148" height="116" rx="13" class="cyan-card"/><text x="868" y="132" class="node-title" text-anchor="start">Graph executor</text><text x="868" y="153" class="small"><tspan x="868" dy="0">bind → ground</tspan><tspan x="868" dy="14">exhaustive query</tspan><tspan x="868" dy="14">deterministic reduce</tspan></text><path d="M 815 265 L 835 265 L 835 160 L 854 160" class="arrow" marker-end="url(#arrowhead)"/><rect x="1022" y="102" width="133" height="116" rx="13" class="green-card"/><text x="1035" y="132" class="node-title" text-anchor="start">Verification</text><text x="1035" y="153" class="small"><tspan x="1035" dy="0">schema + guards</tspan><tspan x="1035" dy="14">evidence + sanity</tspan><tspan x="1035" dy="14">postflight checks</tspan></text><path d="M 1002 160 L 1022 160" class="arrow" marker-end="url(#arrowhead)"/><rect x="854" y="247" width="301" height="59" rx="12" class="card"/><text x="870" y="271" class="node-title" text-anchor="start">Verified AnswerCard</text><text x="870" y="291" class="small" text-anchor="start">answer + evidence + limitations   or   abstain</text><path d="M 1088 218 L 1088 247" class="arrow" marker-end="url(#arrowhead)"/><path d="M 1088 218 L 1088 235 L 780 235 L 780 189" class="arrow-dashed" marker-end="url(#arrowhead)"/><rect x="842" y="222" width="174" height="23" rx="11.5" class="amber-pill"/><text x="929.0" y="237.5" class="pill-text" text-anchor="middle">ELIGIBLE DEFECT → REPLAN</text><text x="57" y="319" class="tiny" text-anchor="start">Step 2 is conditional: a valid Step-1 intent program is compiled deterministically; only the fallback branch calls the graph-plan LLM.</text><text x="30" y="360" class="section" text-anchor="start">B  DIRECT PACS COMPOSE EVALUATION · REAL HELD-OUT EXAMPLE</text><rect x="25" y="371" width="1150" height="356" rx="16" class="pacs-lane"/><rect x="895" y="385" width="253" height="23" rx="11.5" class="amber-pill"/><text x="1021.5" y="400.5" class="pill-text" text-anchor="middle">NO STEP 1 · NO REASONINGPIPELINE</text><rect x="45" y="395" width="365" height="100" rx="12" class="question"/><rect x="58" y="406" width="112" height="23" rx="11.5" class="violet-card"/><text x="114.0" y="421.5" class="pill-text" text-anchor="middle">F6 · L3 · UNSEEN</text><text x="58" y="443" class="body"><tspan x="58" dy="0">Follow DfI Transport and Road Asset Management TRAM&#x27;s</tspan><tspan x="58" dy="15">lead suppliers outward: setting DfI Transport and Road</tspan><tspan x="58" dy="15">Asset Management TRAM itself aside, which buyers do those</tspan><tspan x="58" dy="15">same suppliers also work for?</tspan></text><rect x="45" y="510" width="365" height="195" rx="12" class="card"/><text x="58" y="533" class="node-title" text-anchor="start">Procurement relation fragment</text><path d="M124,610 C153,610 149,558 178,558" class="graph-edge"/><path d="M124,610 C153,610 149,610 178,610" class="graph-edge"/><path d="M124,610 C153,610 149,662 178,662" class="graph-edge"/><path d="M244,558 C273,558 283,551 312,551" class="graph-edge"/><path d="M244,558 C273,558 283,588 312,588" class="graph-edge"/><path d="M244,610 C273,610 283,625 312,625" class="graph-edge"/><path d="M244,662 C273,662 283,662 312,662" class="graph-edge"/><circle cx="91" cy="610" r="25" class="graph-node-buyer"/><text x="91" y="606" class="small" text-anchor="middle">DfI</text><text x="91" y="620" class="small" text-anchor="middle">TRAM</text><circle cx="211" cy="558" r="25" class="graph-node-supplier"/><text x="211" y="555" class="tiny" text-anchor="middle">FP McCann</text><text x="211" y="567" class="tiny" text-anchor="middle">Ltd</text><circle cx="211" cy="610" r="25" class="graph-node-supplier"/><text x="211" y="606" class="tiny" text-anchor="middle">GIBSON</text><text x="211" y="618" class="tiny" text-anchor="middle">QUARRIES</text><circle cx="211" cy="662" r="25" class="graph-node-supplier"/><text x="211" y="659" class="tiny" text-anchor="middle">GREENTOWN</text><text x="211" y="671" class="tiny" text-anchor="middle">ENV.</text><circle cx="345" cy="551" r="24" class="graph-node-buyer"/><text x="345" y="548" class="tiny" text-anchor="middle">Dept. for</text><text x="345" y="560" class="tiny" text-anchor="middle">Infrastructure</text><circle cx="345" cy="588" r="24" class="graph-node-buyer"/><text x="345" y="585" class="tiny" text-anchor="middle">Dept. for</text><text x="345" y="597" class="tiny" text-anchor="middle">Communities</text><circle cx="345" cy="625" r="24" class="graph-node-buyer"/><text x="345" y="622" class="tiny" text-anchor="middle">Lisburn &amp;</text><text x="345" y="634" class="tiny" text-anchor="middle">Castlereagh</text><circle cx="345" cy="662" r="24" class="graph-node-buyer"/><text x="345" y="659" class="tiny" text-anchor="middle">DAERA</text><text x="345" y="671" class="tiny" text-anchor="middle">Forest Service</text><text x="58" y="698" class="tiny" text-anchor="start">17 supplier strings → 18 buyer strings · subset shown</text><rect x="442" y="395" width="316" height="126" rx="12" class="red-card"/><rect x="456" y="406" width="112" height="23" rx="11.5" class="red-pill"/><text x="512.0" y="421.5" class="pill-text" text-anchor="middle">BASE QWEN3-8B</text><text x="456" y="445" class="node-title" text-anchor="start">Wrong role + wrong projection</text><text x="456" y="466" class="mono-small"><tspan x="456" dy="0">filter supplier = DfI TRAM</tspan><tspan x="456" dy="14">project contract_node_id</tspan><tspan x="456" dy="14">difference(contract IDs)</tspan></text><text x="731" y="499" class="error" text-anchor="end">∅  ×</text><rect x="442" y="537" width="700" height="168" rx="12" class="green-card"/><rect x="456" y="548" width="138" height="23" rx="11.5" class="green-pill"/><text x="525.0" y="563.5" class="pill-text" text-anchor="middle">COMPOSE-v3 PLANNER</text><text x="456" y="587" class="node-title" text-anchor="start">Typed compositional plan</text><rect x="456" y="603" width="189" height="70" rx="9" class="violet-card"/><text x="468" y="624" class="small" text-anchor="start">1  discover suppliers</text><text x="468" y="643" class="mono-small"><tspan x="468" dy="0">S = suppliers(</tspan><tspan x="468" dy="13">  buyer = DfI TRAM)</tspan></text><rect x="672" y="603" width="189" height="70" rx="9" class="blue-card"/><text x="684" y="624" class="small" text-anchor="start">2  traverse outward</text><text x="684" y="643" class="mono-small"><tspan x="684" dy="0">B = buyers(</tspan><tspan x="684" dy="13">  supplier IN S)</tspan></text><rect x="888" y="603" width="137" height="70" rx="9" class="cyan-card"/><text x="900" y="624" class="small" text-anchor="start">3  exclude anchor</text><text x="900" y="643" class="mono-small"><tspan x="900" dy="0">answer =</tspan><tspan x="900" dy="13">B − {DfI TRAM}</tspan></text><path d="M 645 638 L 672 638" class="arrow" marker-end="url(#arrowhead)"/><path d="M 861 638 L 888 638" class="arrow" marker-end="url(#arrowhead)"/><rect x="1030" y="590" width="94" height="96" rx="12" class="green-card"/><text x="1077" y="617" class="small" text-anchor="middle">VALID</text><text x="1077" y="648" class="title" text-anchor="middle">17</text><text x="1077" y="665" class="success" text-anchor="middle">stored names ✓</text><path d="M 1025 638 L 1030 638" class="arrow" marker-end="url(#arrowhead)"/><text x="456" y="692" class="tiny" text-anchor="start">validate_tree → deterministic full-universe execution → exact oracle match</text><path d="M 410 436 L 426 436 L 426 458 L 442 458" class="arrow" marker-end="url(#arrowhead)"/><path d="M 410 452 L 426 452 L 426 621 L 442 621" class="arrow" marker-end="url(#arrowhead)"/><text x="30" y="748" class="tiny" text-anchor="start">Solid arrows: executed path   ·   Dashed arrow: bounded repair   ·   Lower panel is capability evidence, not an end-to-end runtime trace</text></svg>