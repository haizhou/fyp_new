<rect x="14" y="18" width="232" height="516" rx="7" class="input"/><text x="29" y="47" class="heading" text-anchor="start">INPUT PROMPT</text><rect x="29" y="64" width="202" height="158" rx="0" class="artifact"/><text x="42" y="91" class="body" text-anchor="start"><tspan x="42" dy="0">How many contract</tspan><tspan x="42" dy="21">notices were published</tspan><tspan x="42" dy="21">by buyers who awarded</tspan><tspan x="42" dy="21">a contract to Dodd</tspan><tspan x="42" dy="21">Group (Midlands)</tspan><tspan x="42" dy="21">Limited?</tspan></text><text x="29" y="252" class="heading" text-anchor="start">Bridge semantics</text><text x="44" y="292" class="body" text-anchor="start">Buyer</text><text x="124" y="292" class="body" text-anchor="start">Dodd Group</text><circle cx="58" cy="317" r="12" fill="#edf4fb" stroke="#2f6fa3" stroke-width="1.3"/><rect x="143" y="305" width="24" height="24" fill="#fff3c4" stroke="#9a6410" stroke-width="1.3"/><path d="M72,317 L139,317" class="arrow" marker-end="url(#arrow)"/><text x="104" y="306" class="tiny" text-anchor="middle">awards</text><text x="58" y="355" class="small" text-anchor="middle">same buyer</text><path d="M58,363 L58,406" class="arrow" marker-end="url(#arrow)"/><rect x="31" y="411" width="138" height="51" rx="0" class="artifact"/><text x="100" y="441" class="small" text-anchor="middle">all notices</text><text x="29" y="493" class="teal" text-anchor="start"><tspan x="29" dy="0">supplier → awarding buyers</tspan><tspan x="29" dy="23">→ those buyers’ notices</tspan></text><text x="266" y="38" class="panel" text-anchor="start">(a) From question to executable graph</text><path d="M246,113 L262,113" class="arrow" marker-end="url(#arrow)"/><line x1="266" y1="113" x2="286" y2="95" stroke="#2f6fa3" stroke-width="1.2"/><line x1="266" y1="113" x2="286" y2="131" stroke="#2f6fa3" stroke-width="1.2"/><line x1="286" y1="95" x2="306" y2="113" stroke="#2f6fa3" stroke-width="1.2"/><line x1="286" y1="131" x2="306" y2="113" stroke="#2f6fa3" stroke-width="1.2"/><line x1="286" y1="95" x2="286" y2="131" stroke="#2f6fa3" stroke-width="1.2"/><circle cx="266" cy="113" r="4.5" fill="#ffffff" stroke="#2f6fa3" stroke-width="1.3"/><circle cx="286" cy="95" r="4.5" fill="#ffffff" stroke="#2f6fa3" stroke-width="1.3"/><circle cx="286" cy="131" r="4.5" fill="#ffffff" stroke="#2f6fa3" stroke-width="1.3"/><circle cx="306" cy="113" r="4.5" fill="#ffffff" stroke="#2f6fa3" stroke-width="1.3"/><text x="286" y="154" class="blue" text-anchor="middle">Step 1</text><text x="286" y="174" class="small" text-anchor="middle">understand</text><path d="M311,113 L337,113" class="arrow" marker-end="url(#arrow)"/><rect x="341" y="56" width="220" height="145" rx="0" class="learned"/><text x="357" y="83" class="heading" text-anchor="start">Typed intent</text><text x="357" y="111" class="mono" text-anchor="start"><tspan x="357" dy="0">A  supplier = Dodd</tspan><tspan x="357" dy="23">B  buyers = distinct(A)</tspan><tspan x="357" dy="23">C  records: buyer ∈ B</tspan><tspan x="357" dy="23">D  count(C)</tspan></text><path d="M561,115 L583,115" class="arrow" marker-end="url(#arrow)"/><polygon points="616,81 651,115 616,149 581,115" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="616" y="107" class="small" text-anchor="middle"><tspan x="616" dy="0">valid</tspan><tspan x="616" dy="19">no veto</tspan></text><path d="M651,96 L674,96" class="arrow" marker-end="url(#arrow)"/><rect x="678" y="63" width="156" height="65" rx="0" class="deterministic"/><text x="756" y="88" class="small" text-anchor="middle"><tspan x="756" dy="0">deterministic</tspan><tspan x="756" dy="20">intent compiler</tspan></text><path d="M616,149 L616,188 L678,188" class="branch" marker-end="url(#gray-arrow)"/><rect x="682" y="159" width="152" height="56" rx="0" class="bypassed"/><text x="758" y="181" class="tiny" text-anchor="middle"><tspan x="758" dy="0">Step 2 planner</tspan><tspan x="758" dy="19">not used here</tspan></text><path d="M834,96 L855,96" class="arrow" marker-end="url(#arrow)"/><rect x="859" y="55" width="167" height="148" rx="0" class="artifact"/><text x="943" y="81" class="heading" text-anchor="middle">Typed DAG</text><text x="887" y="116" class="blue" text-anchor="start">A</text><text x="943" y="116" class="blue" text-anchor="start">B</text><text x="999" y="116" class="blue" text-anchor="start">C</text><path d="M901,110 L929,110" class="arrow" marker-end="url(#arrow)"/><path d="M957,110 L985,110" class="arrow" marker-end="url(#arrow)"/><text x="887" y="145" class="tiny" text-anchor="middle">record</text><text x="943" y="145" class="tiny" text-anchor="middle">buyers</text><text x="999" y="145" class="tiny" text-anchor="middle">record</text><text x="943" y="178" class="teal" text-anchor="middle">COUNT(C)</text><line x1="263" y1="235" x2="1027" y2="235" class="rule"/><text x="266" y="268" class="panel" text-anchor="start">(b) Deterministic bridge execution</text><rect x="273" y="294" width="165" height="207" rx="0" class="artifact"/><text x="289" y="322" class="heading" text-anchor="start">A · source</text><text x="289" y="348" class="mono" text-anchor="start"><tspan x="289" dy="0">supplier_name =</tspan><tspan x="289" dy="21">Dodd Group</tspan></text><line x1="286" y1="382" x2="425" y2="382" class="grid"/><text x="289" y="407" class="small" text-anchor="start">Dudley MBC</text><text x="289" y="431" class="small" text-anchor="start">Solihull MBC</text><text x="289" y="455" class="small" text-anchor="start">Fusion21</text><text x="422" y="485" class="teal" text-anchor="end">21 records</text><path d="M438,394 L459,394" class="arrow" marker-end="url(#arrow)"/><rect x="463" y="294" width="135" height="207" rx="0" class="artifact"/><text x="479" y="322" class="heading" text-anchor="start">B · buyers</text><text x="479" y="348" class="tiny" text-anchor="start">emit buyer</text><text x="479" y="379" class="small" text-anchor="start">Dudley MBC</text><text x="479" y="405" class="small" text-anchor="start">Solihull MBC</text><text x="479" y="431" class="small" text-anchor="start"><tspan x="479" dy="0">Dept. for</tspan><tspan x="479" dy="21">Education</tspan></text><text x="479" y="475" class="small" text-anchor="start">… +13</text><text x="582" y="485" class="teal" text-anchor="end">16 values</text><path d="M598,394 L619,394" class="arrow" marker-end="url(#arrow)"/><rect x="623" y="294" width="165" height="207" rx="0" class="artifact"/><text x="639" y="322" class="heading" text-anchor="start">C · records</text><text x="639" y="348" class="tiny" text-anchor="start">buyer_name ∈ B</text><text x="639" y="379" class="small" text-anchor="start">DfE</text><text x="772" y="379" class="small" text-anchor="end">858</text><text x="639" y="406" class="small" text-anchor="start">Sandwell</text><text x="772" y="406" class="small" text-anchor="end">303</text><text x="639" y="433" class="small" text-anchor="start">Fusion21</text><text x="772" y="433" class="small" text-anchor="end">219</text><text x="639" y="460" class="small" text-anchor="start">13 other buyers</text><text x="772" y="485" class="teal" text-anchor="end">1,940 records</text><path d="M788,394 L809,394" class="arrow" marker-end="url(#arrow)"/><rect x="813" y="294" width="213" height="207" rx="0" class="check"/><text x="919" y="325" class="heading" text-anchor="middle">COUNT(C) = 1,940</text><text x="829" y="356" class="green" text-anchor="start">graph execution  ✓</text><text x="829" y="383" class="green" text-anchor="start">KG evidence: 1,940  ✓</text><text x="829" y="410" class="green" text-anchor="start">answer sanity  ✓</text><rect x="826" y="430" width="187" height="58" rx="0" class="warning"/><text x="919" y="451" class="amber" text-anchor="middle"><tspan x="919" dy="0">coverage: 8/200 sampled rows</tspan><tspan x="919" dy="21">lack supplier field</tspan></text></svg>