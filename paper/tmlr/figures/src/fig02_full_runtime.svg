<svg xmlns="http://www.w3.org/2000/svg" width="6.5in" height="2.34in" viewBox="0 0 1000 360" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Implemented full question-answering runtime with a stored multi-hop trace</title>
<desc id="svg-desc">A question is converted to a typed intent program. Valid intent programs take a deterministic compiler path, while invalid or vetoed programs use a conditional graph planner. The resulting executable graph is grounded, run over the procurement graph and checked before an answer is released. A stored multi-hop trace illustrates the deterministic fast path and returns one thousand nine hundred forty notices.</desc>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 z" fill="#222222"/></marker>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #171717; }
    .panel { font-size: 17px; font-weight: 700; }
    .label { font-size: 14px; font-weight: 700; }
    .body { font-size: 13px; }
    .small { font-size: 12px; fill: #505050; }
    .mini { font-size: 11.2px; fill: #5d5d5d; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .arrow { fill: none; stroke: #222222; stroke-width: 1.25; }
    .feedback { fill: none; stroke: #666666; stroke-width: 1.1; stroke-dasharray: 5 4; }
    .rule { stroke: #777777; stroke-width: 0.9; }
    .learned { fill: #2f6fa3; font-weight: 700; }
    .correct { fill: #2e7d32; font-weight: 700; }
    .abstain { fill: #7a5814; font-weight: 700; }
    .tracebox { fill: #ffffff; stroke: #777777; stroke-width: 0.8; }
  </style>
</defs>
<rect width="1000" height="360" fill="#ffffff"/>
<text x="15" y="23" class="panel" text-anchor="start">(a) Full runtime</text><rect x="15" y="45" width="72" height="66" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="15" y1="45" x2="87" y2="45" stroke="#333333" stroke-width="3"/><text x="23" y="68" class="label" text-anchor="start">Question</text><text x="23" y="87" class="mini"><tspan x="23" dy="0">+ schema</tspan></text><rect x="105" y="45" width="122" height="66" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="105" y1="45" x2="227" y2="45" stroke="#2f6fa3" stroke-width="3"/><text x="113" y="68" class="label" text-anchor="start">Interpret</text><text x="113" y="87" class="mini"><tspan x="113" dy="0">intent program</tspan><tspan x="113" dy="14">answer signature</tspan></text><rect x="326" y="45" width="119" height="66" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="326" y1="45" x2="445" y2="45" stroke="#333333" stroke-width="3"/><text x="334" y="68" class="label" text-anchor="start">Compile</text><text x="334" y="87" class="mini"><tspan x="334" dy="0">entities · DAG</tspan><tspan x="334" dy="14">executable graph</tspan></text><rect x="463" y="45" width="119" height="66" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="463" y1="45" x2="582" y2="45" stroke="#333333" stroke-width="3"/><text x="471" y="68" class="label" text-anchor="start">Ground</text><text x="471" y="87" class="mini"><tspan x="471" dy="0">schema · values</tspan><tspan x="471" dy="14">guards · preflight</tspan></text><rect x="600" y="45" width="118" height="66" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="600" y1="45" x2="718" y2="45" stroke="#333333" stroke-width="3"/><text x="608" y="68" class="label" text-anchor="start">Execute</text><text x="608" y="87" class="mini"><tspan x="608" dy="0">bound variables</tspan><tspan x="608" dy="14">exact reduction</tspan></text><rect x="736" y="45" width="143" height="66" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="736" y1="45" x2="879" y2="45" stroke="#4f6f5a" stroke-width="3"/><text x="744" y="68" class="label" text-anchor="start">Release checks</text><text x="744" y="87" class="mini"><tspan x="744" dy="0">evidence · sanity</tspan><tspan x="744" dy="14">postflight</tspan></text><path d="M87,78 L105,78" class="arrow" marker-end="url(#arrowhead)"/><path d="M290,78 L326,78" class="arrow" marker-end="url(#arrowhead)"/><path d="M445,78 L463,78" class="arrow" marker-end="url(#arrowhead)"/><path d="M582,78 L600,78" class="arrow" marker-end="url(#arrowhead)"/><path d="M718,78 L736,78" class="arrow" marker-end="url(#arrowhead)"/><polygon points="259,49 290,78 259,107 228,78" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><text x="259" y="73" class="mini" text-anchor="middle">valid</text><text x="259" y="87" class="mini" text-anchor="middle">intent?</text><path d="M227,78 L228,78" class="arrow" marker-end="url(#arrowhead)"/><text x="297" y="68" class="mini" text-anchor="start">yes</text><rect x="235" y="132" width="110" height="45" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="235" y1="132" x2="345" y2="132" stroke="#2f6fa3" stroke-width="3"/><text x="244" y="151" class="label" text-anchor="start">Step-2 planner</text><text x="244" y="167" class="mini" text-anchor="start">fallback graph plan</text><path d="M259,107 L259,132" class="arrow" marker-end="url(#arrowhead)"/><text x="266" y="124" class="mini" text-anchor="start">no / veto</text><path d="M345,154 L385,154 L385,111" class="arrow" marker-end="url(#arrowhead)"/><path d="M879,63 L900,63" class="arrow" marker-end="url(#arrowhead)"/><path d="M879,96 L900,96" class="arrow" marker-end="url(#arrowhead)"/><text x="907" y="60" class="correct" text-anchor="start">Answer + evidence</text><text x="907" y="79" class="mini" text-anchor="start">or</text><text x="907" y="99" class="abstain" text-anchor="start">No verified answer</text><path d="M807,111 L807,190 L290,190 L290,177" class="feedback" marker-end="url(#arrowhead)"/><text x="520" y="185" class="mini" text-anchor="middle">structured failure · bounded replan · rerun ground → execute → checks</text><line x1="15" y1="211" x2="985" y2="211" class="rule"/><text x="15" y="236" class="panel" text-anchor="start">(b) Stored multi-hop trace — deterministic fast path</text><rect x="15" y="253" width="190" height="87" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="15" y1="253" x2="205" y2="253" stroke="#333333" stroke-width="3"/><text x="25" y="274" class="small"><tspan x="25" dy="0">Record check: how many contract</tspan><tspan x="25" dy="15">notices were published by</tspan><tspan x="25" dy="15">buyers that have awarded a</tspan><tspan x="25" dy="15">contract to Dodd Group</tspan><tspan x="25" dy="15">(Midlands) Limited?</tspan></text><path d="M205,296 L222,296" class="arrow" marker-end="url(#arrowhead)"/><rect x="224" y="253" width="250" height="87" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="224" y1="253" x2="474" y2="253" stroke="#2f6fa3" stroke-width="3"/><text x="234" y="274" class="label" text-anchor="start">Step-1 intent program</text><text x="234" y="293" class="mono"><tspan x="234" dy="0">A filter supplier = Dodd Group</tspan><tspan x="234" dy="16">B distinct buyers  →  C filter buyer ∈ B</tspan><tspan x="234" dy="16">D count(C)</tspan></text><path d="M474,296 L492,296" class="arrow" marker-end="url(#arrowhead)"/><rect x="494" y="253" width="178" height="87" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="494" y1="253" x2="672" y2="253" stroke="#333333" stroke-width="3"/><text x="504" y="274" class="label" text-anchor="start">Compiled graph</text><text x="504" y="295" class="mono"><tspan x="504" dy="0">A record_set</tspan><tspan x="504" dy="15">→ B buyer_set</tspan><tspan x="504" dy="15">→ C bound records</tspan></text><path d="M672,296 L690,296" class="arrow" marker-end="url(#arrowhead)"/><rect x="692" y="253" width="112" height="87" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="692" y1="253" x2="804" y2="253" stroke="#333333" stroke-width="3"/><text x="702" y="274" class="label" text-anchor="start">Execute</text><text x="748" y="304" class="mono" text-anchor="middle">count(C)</text><text x="748" y="326" class="mini" text-anchor="middle">no repair</text><path d="M804,296 L822,296" class="arrow" marker-end="url(#arrowhead)"/><rect x="824" y="253" width="161" height="87" fill="#ffffff" stroke="#444444" stroke-width="0.9"/><line x1="824" y1="253" x2="985" y2="253" stroke="#4f6f5a" stroke-width="3"/><text x="834" y="274" class="label" text-anchor="start">Verified result</text><text x="904" y="307" class="panel" text-anchor="middle">1,940</text><text x="904" y="328" class="correct" text-anchor="middle">passed · oracle match ✓</text><text x="480" y="351" class="mini" text-anchor="middle">Valid Step-1 program → deterministic compiler; the conditional Step-2 planner is bypassed for this trace.</text></svg>