# LLaMA-Factory RSFT config — CICADA Step-2 planner student (Llama-3.1-8B, QLoRA)
# Cross-base twin of qwen3_8b_rsft_qlora.yaml — identical data recipe & hyperparameters,
# only base model, adapter path, dataset dir and chat template differ.

### model
# Ungated identical-weights mirror (see llama31_8b_sft_qlora.yaml); adapter continues that SFT run.
model_name_or_path: NousResearch/Meta-Llama-3.1-8B-Instruct
adapter_name_or_path: outputs/llama31_8b_cicada_sft_v1

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
quantization_bit: 4
bf16: true
flash_attn: sdpa            # flash-attn unavailable (no cu130 wheel/nvcc); SDPA uses H100 flash kernels

### dataset
dataset_dir: data/training/llamafactory_rsft_llama_r1   # round-2 export dir
dataset: cicada_plan_sft,cicada_repair_sft
eval_dataset: cicada_plan_sft_val
template: llama3
cutoff_len: 6144
overwrite_cache: true
preprocessing_num_workers: 8

### training
output_dir: outputs/llama31_8b_cicada_rsft_v1
per_device_train_batch_size: 4   # H100, kept modest to bound Qwen 151936-vocab logits.float() upcast; effective batch unchanged
gradient_accumulation_steps: 4   # effective batch 16 (4x4)
learning_rate: 5.0e-5            # lower than SFT: refinement round, not cold start
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
logging_steps: 10
save_steps: 200
eval_strategy: steps
eval_steps: 200
plot_loss: true
gradient_checkpointing: true
report_to: none
