# LLaMA-Factory DPO config — CICADA Step-2 planner student (Qwen3-8B, QLoRA)
# Ladder order is SFT -> RSFT -> DPO, so this continues the RSFT adapter by default;
# point adapter_name_or_path at outputs/qwen3_8b_cicada_sft_v1 if skipping RSFT.
# QLoRA note: the quantized base cannot merge adapters, so training CONTINUES the loaded
# adapter — lora_rank/alpha MUST match the SFT/RSFT adapter (64/128).
# Pair sources (see run_teacher.py routing): attempt-protocol pairs + oracle-gated
# wrong-answer-repair pairs (chosen=repaired, rejected=verifier-passing-but-wrong).

### model
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: outputs/qwen3_8b_cicada_rsft_v1
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
quantization_bit: 4
bf16: true
flash_attn: fa2
pref_beta: 0.1
pref_loss: sigmoid

### dataset
dataset_dir: data/training/llamafactory_v1
dataset: cicada_dpo
template: qwen3
enable_thinking: false         # train/serve consistency (no think blocks)
cutoff_len: 6144
overwrite_cache: true

### training
output_dir: outputs/qwen3_8b_cicada_dpo_v1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
logging_steps: 10
save_steps: 100
gradient_checkpointing: true
report_to: none
