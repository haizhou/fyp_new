# LLaMA-Factory SFT config — CICADA Step-1 UNDERSTANDING student (Qwen3-8B, QLoRA)
# Purpose: replace Azure nano for Step-1 -> fully-local system (zero API).
# Data: data/training/llamafactory_step1_v1 (5,091 oracle-gated intent-program briefings,
# prompts rendered by the runtime builder question_intent_program_messages).
# Recipe identical to the Step-2 SFT rung (r64/a128, eff batch 16, 3 epochs, lr 1e-4) —
# one recipe across all adapters keeps the serving stack single-config (max-lora-rank 64).

### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
quantization_bit: 4
bf16: true
flash_attn: sdpa            # no cu130 flash-attn wheel on this node (see step2 configs)

### dataset
dataset_dir: data/training/llamafactory_step1_v1
dataset: cicada_step1_sft
eval_dataset: cicada_step1_sft_val
template: qwen3
enable_thinking: false      # train/serve consistency (no think blocks)
cutoff_len: 6144
overwrite_cache: true
preprocessing_num_workers: 2

### training
output_dir: outputs/qwen3_8b_cicada_step1_v1
resume_from_checkpoint: outputs/qwen3_8b_cicada_step1_v1/checkpoint-600
per_device_train_batch_size: 4
gradient_accumulation_steps: 4   # effective batch 16
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
logging_steps: 10
save_steps: 200
eval_strategy: steps
eval_steps: 200
plot_loss: true
gradient_checkpointing: true
report_to: none
