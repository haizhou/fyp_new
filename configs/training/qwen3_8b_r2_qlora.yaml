# LLaMA-Factory RSFT config — CICADA Step-2 planner student (Qwen3-8B, QLoRA)
# Rejection-sampling round: the SFT student self-harvests on the train pool
# (run_teacher.py --plan-base-url <vLLM> --plan-model <student>), the verifier keeps
# what passes, export_llamafactory.py renders round-2 data — NO teacher involved.
# Continues training from the SFT adapter on that self-generated pool.

### model
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: outputs/qwen3_8b_cicada_dpo_v1   # r2 = iterative RSFT from the DPO champion (on-policy: trains the policy that generated the harvest)
trust_remote_code: true

### method
stage: sft
do_train: true
overwrite_output_dir: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
quantization_bit: 4
bf16: true
flash_attn: sdpa            # flash-attn unavailable (no cu130 wheel/nvcc); SDPA uses H100 flash kernels

### dataset
dataset_dir: data/training/llamafactory_rsft_qwen_r2
dataset: cicada_plan_sft,cicada_repair_sft
eval_dataset: cicada_plan_sft_val
template: qwen3
enable_thinking: false         # train/serve consistency (no think blocks)
cutoff_len: 6144
overwrite_cache: true
preprocessing_num_workers: 1

### training
output_dir: outputs/qwen3_8b_cicada_r2_v1
per_device_train_batch_size: 4   # H100, kept modest to bound Qwen 151936-vocab logits.float() upcast; effective batch unchanged
gradient_accumulation_steps: 4   # effective batch 16 (4x4)
learning_rate: 5.0e-5            # lower than SFT: refinement round, not cold start
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.03
max_grad_norm: 1.0
logging_steps: 10
save_steps: 200
eval_strategy: steps
eval_steps: 200
plot_loss: true
gradient_checkpointing: true
report_to: none
